# Full experiment configuration. Paths are relative to the project root.
run_name: default
data_path: data/cases.jsonl          # preprocessed cases (see README "Data format")
labels_path: configs/labels.yaml     # synonym map used to grade free-text diagnoses
results_dir: results

# --- model / Ollama ---
model: qwen3-vl:8b-instruct          # non-thinking variant; the plain qwen3-vl:8b tag thinks (~100 s/answer) even with think=false. qwen3-vl:4b-instruct for less memory
ollama_host: http://localhost:11434
think: false                         # disable hidden reasoning (if the model supports toggling it)
num_ctx: 8192
keep_alive: 30m
image_max_side: 1024                 # images are downscaled to this before sending
images_per_case: 1                   # first N images of each case; null = all images

# --- sampling (seed variance = uncertainty metric) ---
n_samples: 5                         # repeated runs per case x stage x mode
base_seed: 0                         # sample k uses seed base_seed + k
temperature: 0.7
max_retries: 2                       # extra attempts when the JSON answer can't be parsed

# --- experiment ---
max_cases: null                      # null = all cases
stages: [1, 2, 3, 4]
modes: [independent, cascade]        # independent: fresh chat per stage; cascade: stages 2-4 continue the stage-1 chat
target_label: Eczema                 # positive class for the binary eczema metrics
answer_format: free_text             # free_text: model names the condition; mcq: pick from options (see configs/mcq.yaml)

# Context fields the model may see. key -> how the field is described to the model.
# Keys must match the keys in each case's "context" object.
context_fields:
  duration: How long the condition has been present
  body_location: Location on the body
  texture: Texture of the affected skin
  symptoms: Symptoms at the affected area
  other_symptoms: Other symptoms
  age: Age group
  sex: Sex at birth
  fitzpatrick: Fitzpatrick skin type
